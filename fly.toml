app = "detour-montreal-api"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  DETOUR_CORS_ORIGINS = ""
  DETOUR_GRAPH_MANIFEST_PATH = "/app/data/graphs/manifest.json"
  DETOUR_MAX_ROUTE_DISTANCE_KM = "35"
  DETOUR_RATE_LIMIT_PER_MINUTE = "30"
  DETOUR_ROUTE_CACHE_TTL_SECONDS = "60"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 2
    hard_limit = 4

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    path = "/ready"
    timeout = "5s"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "detour_data"
  destination = "/app/data"
